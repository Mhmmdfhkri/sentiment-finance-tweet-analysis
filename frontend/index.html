<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Tweet Sentiment Analysis</title>
    <!-- Menggunakan Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-lg">
        <h1 class="text-2xl font-bold text-gray-800 mb-1 text-center"> Finance Sentiment Analyzer</h1><br>

        <!-- Form Input -->
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Financial Tweet / Text</label>
                <textarea id="tweetInput" rows="4" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none transition" placeholder="Type a financial tweet here... (e.g., $BYND JPMorgan reels in expectations)"></textarea>
            </div>

            <button id="analyzeBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition duration-200 shadow-md">
                Analyze Sentiment
            </button>
        </div>

        <!-- Result Card (Hidden by default) -->
        <div id="resultContainer" class="mt-6 p-5 rounded-lg border hidden transition-all duration-300">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-semibold uppercase tracking-wider text-gray-500">Prediction Result</span>
                <span id="modelIndicator" class="text-xs bg-gray-200 text-gray-700 px-2 py-0.5 rounded font-mono">BERT</span>
            </div>
            <h2 id="sentimentResult" class="text-2xl font-bold">Neutral</h2>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
